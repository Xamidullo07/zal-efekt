plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.zalefekt'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.zalefekt'
        minSdk 21
        // 28: eski mashina monitorlari (Android 5-10) va tizim effektlari bilan eng yaxshi moslik
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
